spring:
  application:
    name: flowcart
  # 基础设施连接（postgres / rabbitmq / temporal）随各 slice 落地后在此启用，
  # 例如：spring.datasource / spring.flyway / spring.rabbitmq / spring.temporal 等。

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

# 运行时角色（ADR-0009 §5）：--role=api|worker|scheduler，单机起步合一。
# 骨架阶段仅作为配置占位，role 实际启停逻辑随 worker-runtime slice 落地。
app:
  role: api,worker,scheduler
